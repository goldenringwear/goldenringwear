<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | GoldenRingWear</title><style>
:root{--navy:#07111f;--gold:#caa45d;--gold2:#e5c27b;--cream:#f7f3ea;--muted:#718096;--line:#e8e3d8;--shadow:0 18px 50px rgba(7,17,31,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;background:#fff;color:var(--navy)}
a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.topbar{background:var(--navy);color:#fff;text-align:center;padding:9px 16px;font-size:12px;letter-spacing:.4px}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #eee}.nav{max-width:1240px;margin:auto;padding:17px 22px;display:flex;align-items:center;gap:28px}
.logo{font-family:Georgia,serif;font-size:24px;font-weight:700;letter-spacing:1px}.logo span{color:var(--gold)}.menu{display:flex;gap:25px;margin-left:auto;font-size:14px}.menu a:hover{color:#a77d32}.actions{display:flex;gap:8px;margin-left:10px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer}
.hero{background:linear-gradient(120deg,#07111f,#17283d);color:#fff}.hero-inner{max-width:1240px;margin:auto;min-height:590px;padding:80px 22px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:40px}
.eyebrow{color:var(--gold2);letter-spacing:3px;font-size:12px;text-transform:uppercase;font-weight:700}.hero h1{font-family:Georgia,serif;font-size:clamp(46px,7vw,82px);line-height:.98;margin:18px 0}.hero p{color:#d7dee8;max-width:560px;line-height:1.8}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;padding:14px 22px;cursor:pointer;font-weight:700}.btn-gold{background:var(--gold);color:#111}.btn-dark{background:var(--navy);color:#fff}.btn-light{background:#fff;color:var(--navy)}
.hero-card{min-height:390px;border-radius:18px;background:radial-gradient(circle at 30% 20%,#304963,#0c1726 65%);display:flex;align-items:end;padding:30px;box-shadow:var(--shadow)}.hero-card div{font-family:Georgia,serif;font-size:32px}
.section{max-width:1240px;margin:auto;padding:78px 22px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.section h2{font-family:Georgia,serif;font-size:38px;margin:0}.muted{color:var(--muted)}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.cat{min-height:260px;border-radius:16px;background:var(--navy);color:#fff;padding:25px;display:flex;align-items:end}.cat:nth-child(2){background:#263747}.cat:nth-child(3){background:#5c6d74}.cat:nth-child(4){background:#6e6358}.cat h3{font-family:Georgia,serif;font-size:28px;margin:0}.cat small{color:#d9dee5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid #eee;border-radius:14px;overflow:hidden;background:#fff;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.pic{height:330px;background:#f1eee8;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:12px;left:12px;background:var(--navy);color:#fff;padding:7px 9px;border-radius:3px;font-size:10px;letter-spacing:1px}.cardbody{padding:16px}.cardbody h3{margin:0 0 9px;font-size:15px}.price{font-weight:800}.old{text-decoration:line-through;color:#999;font-weight:400;margin-left:7px;font-size:13px}.empty{padding:45px;text-align:center;border:1px dashed #ccc;border-radius:12px;grid-column:1/-1}
.banner{background:var(--cream);padding:60px 30px;border-radius:18px;text-align:center}.banner h2{font-family:Georgia,serif;font-size:42px;margin:0 0 10px}.footer{background:var(--navy);color:#fff;padding:55px 22px}.footer-inner{max-width:1240px;margin:auto;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px}.footer p{color:#b9c2cd;line-height:1.7}.footer h4{margin-top:0}.footer a{display:block;color:#cbd2da;margin:9px 0;font-size:14px}
.page{max-width:1240px;margin:auto;padding:42px 22px 80px}.crumb{font-size:13px;color:var(--muted);margin-bottom:25px}.page-title{font-family:Georgia,serif;font-size:46px;margin:0 0 10px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.filter{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}.filter.active{background:var(--navy);color:#fff}
.product{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding-top:25px}.product-image{background:#f1eee8;border-radius:18px;min-height:620px;display:flex;align-items:center;justify-content:center;overflow:hidden}.product-image img{width:100%;height:100%;object-fit:cover}.product-info h1{font-family:Georgia,serif;font-size:48px;line-height:1.05;margin:0 0 15px}.bigprice{font-size:25px;font-weight:800;margin:20px 0}.label{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:25px 0 9px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #ddd;border-radius:5px;padding:10px 14px;cursor:pointer;background:#fff}.chip.selected{border-color:var(--navy);background:var(--navy);color:#fff}.qty{display:flex;align-items:center;gap:12px;margin:20px 0}.qty button{width:38px;height:38px;border:1px solid #ddd;background:#fff;cursor:pointer}.qty input{width:45px;text-align:center;border:1px solid #ddd;height:38px}
.checkout{max-width:1050px;margin:auto;padding:50px 22px 90px}.checkout-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:35px}.box{border:1px solid var(--line);border-radius:14px;padding:24px}.box h2{font-family:Georgia,serif;margin-top:0}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:5px;outline:none}.field textarea{min-height:95px;resize:vertical}.summary-row{display:flex;justify-content:space-between;margin:13px 0}.total{border-top:1px solid var(--line);padding-top:15px;font-size:20px;font-weight:800}.pay{display:flex;gap:10px}.pay label{flex:1;border:1px solid #ddd;border-radius:7px;padding:14px;cursor:pointer}.pay input{margin-right:7px}.notice{padding:14px;border-radius:8px;background:var(--cream);margin:15px 0;font-size:13px}.success{max-width:650px;margin:80px auto;padding:45px 25px;text-align:center;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.success h1{font-family:Georgia,serif;font-size:42px}
@media(max-width:900px){.hero-inner,.product,.checkout-grid{grid-template-columns:1fr}.categories{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.menu{display:none}.hero-inner{min-height:auto;padding:65px 22px}.product-image{min-height:430px}.footer-inner{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.categories,.grid{grid-template-columns:1fr 1fr;gap:10px}.pic{height:235px}.section{padding:55px 15px}.nav{padding:14px 15px}.hero h1{font-size:50px}.product-info h1{font-size:38px}.page-title{font-size:38px}}
</style></head><body><div class="topbar">PREMIUM RAINWEAR • 5% GST • FREE DELIVERY</div><header class="header"><nav class="nav"><a class="logo" href="index.html">Golden<span>Ring</span>Wear</a><div class="menu"><a href="category.html?cat=Men">Men</a><a href="category.html?cat=Women">Women</a><a href="category.html?cat=Boys">Boys</a><a href="category.html?cat=Girls">Girls</a></div><div class="actions"><button class="iconbtn" onclick="location.href='order.html'">🛒</button></div></nav></header><main class="page"><div class="crumb"><a href="category.html">Collection</a> / Product</div><div id="app"><div class="empty">Loading product…</div></div></main><script>const API='https://script.google.com/macros/s/AKfycbzwMJbuwOr9VyvcotM1Y5Hrot8FXiCliTNY9QsPdhWQNiWy7-ewyXTdcPXz6MCsfT_nuw/exec';const id=new URLSearchParams(location.search).get("id");let p=null,qty=1,color="",size="";function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}function chips(v,t){return String(v||"").split(/[,|]/).map(x=>x.trim()).filter(Boolean).map(x=>`<button class="chip" data-type="${t}" data-value="${x}">${x}</button>`).join("")}function render(){document.getElementById("app").innerHTML=`<div class="product"><div class="product-image">${p.image?`<img src="${p.image}" alt="${p.name}">`:"<span class=\"muted\">GoldenRingWear</span>"}</div><div class="product-info"><div class="eyebrow">${p.category}</div><h1>${p.name}</h1><p class="muted">${p.description||"Premium rainwear designed for everyday use."}</p><div class="bigprice">${money(p.price)} ${p.regularPrice>p.price?`<span class="old">${money(p.regularPrice)}</span>`:""}</div><div class="notice">Final price at checkout: product amount + 5% GST. Delivery charge: ₹0.</div>${p.colors?`<div class="label">Colour</div><div class="chips" id="colors">${chips(p.colors,"color")}</div>`:""}${p.sizes?`<div class="label">Size</div><div class="chips" id="sizes">${chips(p.sizes,"size")}</div>`:""}<div class="label">Quantity</div><div class="qty"><button onclick="changeQty(-1)">−</button><input id="qty" value="1" readonly><button onclick="changeQty(1)">+</button></div><button class="btn btn-dark" style="width:100%" onclick="addCart()">Add to Cart</button><button class="btn btn-gold" style="width:100%;margin-top:10px" onclick="buyNow()">Buy Now</button></div></div>`;document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const t=c.dataset.type;document.querySelectorAll('.chip[data-type="'+t+'"]').forEach(x=>x.classList.remove("selected"));c.classList.add("selected");if(t==="color")color=c.dataset.value;else size=c.dataset.value})}function changeQty(n){qty=Math.max(1,Math.min(Number(p.stock||1),qty+n));document.getElementById("qty").value=qty}function getCart(){try{return JSON.parse(localStorage.getItem("grw_cart")||"[]")}catch(e){return[]}}function saveCart(c){localStorage.setItem("grw_cart",JSON.stringify(c))}function addCart(){let c=getCart(),key=p.id+"|"+color+"|"+size,x=c.find(i=>i.key===key);if(x)x.quantity=Math.min(Number(p.stock||999),x.quantity+qty);else c.push({key:key,productId:p.id,name:p.name,price:p.price,image:p.image,color:color,size:size,quantity:qty});saveCart(c);location.href="order.html"}function buyNow(){localStorage.setItem("grw_cart",JSON.stringify([{key:p.id+"|"+color+"|"+size,productId:p.id,name:p.name,price:p.price,image:p.image,color:color,size:size,quantity:qty}]));location.href="order.html"}if(!id)document.getElementById("app").innerHTML='<div class="empty">Product ID missing.</div>';else fetch(API+"?action=product&id="+encodeURIComponent(id)).then(r=>r.json()).then(d=>{if(d&&d.id){p=d;document.title=p.name+" | GoldenRingWear";render()}else document.getElementById("app").innerHTML='<div class="empty">Product not found.</div>'}).catch(()=>document.getElementById("app").innerHTML='<div class="empty">Product is temporarily unavailable.</div>');</script></body></html>
