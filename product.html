<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | GoldenRingWear</title>
<style>
:root{--navy:#07111f;--gold:#caa45d;--gold2:#e5c27b;--cream:#f7f3ea;--muted:#718096;--line:#e8e3d8;--shadow:0 18px 50px rgba(7,17,31,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--navy)}a{text-decoration:none;color:inherit}button{font:inherit}
.topbar{background:var(--navy);color:#fff;text-align:center;padding:9px 16px;font-size:12px}.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #eee}.nav{max-width:1240px;margin:auto;padding:17px 22px;display:flex;align-items:center;gap:28px}.logo{font:700 24px Georgia,serif}.logo span{color:var(--gold)}.menu{display:flex;gap:25px;margin-left:auto;font-size:14px}.actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer}
.page{max-width:1240px;margin:auto;padding:42px 22px 80px}.crumb{font-size:13px;color:var(--muted);margin-bottom:25px}.muted{color:var(--muted);line-height:1.8}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;padding-top:25px}
.gallery{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:start}.thumbs{display:flex;flex-direction:column;gap:9px}.thumb{width:86px;height:100px;border:1px solid #ddd;background:#f1eee8;padding:0;cursor:pointer;overflow:hidden;border-radius:7px}.thumb.active{border:2px solid var(--gold)}.thumb img{width:100%;height:100%;object-fit:cover}.main-image{background:#f1eee8;border-radius:18px;height:650px;overflow:hidden;position:relative}.main-image img{width:100%;height:100%;object-fit:cover}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.88);cursor:pointer;font-size:22px}.prev{left:15px}.next{right:15px}
.eyebrow{color:#a98546;font-size:11px;letter-spacing:3px;font-weight:800;text-transform:uppercase}h1{font:400 52px/1.05 Georgia,serif;margin:12px 0 15px}.bigprice{font-size:28px;font-weight:800;margin:20px 0}.old{text-decoration:line-through;color:#999;font-size:15px;font-weight:400;margin-left:8px}.label{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:25px 0 9px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #ddd;border-radius:5px;padding:10px 14px;cursor:pointer;background:#fff}.chip.selected{border-color:var(--navy);background:var(--navy);color:#fff}.qty{display:flex;align-items:center;gap:12px;margin:20px 0}.qty button{width:40px;height:40px;border:1px solid #ddd;background:#fff;cursor:pointer}.qty input{width:48px;text-align:center;border:1px solid #ddd;height:40px}.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:15px;border:0;border-radius:5px;font-weight:800;cursor:pointer;margin-top:10px}.dark{background:var(--navy);color:#fff}.gold{background:var(--gold);color:#111}.notice{padding:14px;border-radius:8px;background:var(--cream);margin:15px 0;font-size:13px}.wish{background:#fff;border:1px solid #ddd;color:var(--navy)}.footer{background:var(--navy);color:#fff;padding:55px 22px}.footer-inner{max-width:1240px;margin:auto;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px}.footer p{color:#b9c2cd;line-height:1.7}
@media(max-width:900px){.product{grid-template-columns:1fr}.main-image{height:520px}.menu{display:none}}@media(max-width:560px){.page{padding:35px 15px 60px}.gallery{grid-template-columns:1fr}.thumbs{order:2;flex-direction:row;overflow:auto}.thumb{min-width:70px;width:70px;height:82px}.main-image{height:430px}h1{font-size:40px}}
</style></head>
<body><div class="topbar">PREMIUM RAINWEAR • 5% GST • FREE DELIVERY</div><header class="header"><nav class="nav"><a class="logo" href="index.html">Golden<span>Ring</span>Wear</a><div class="menu"><a href="category.html?cat=Men">Men</a><a href="category.html?cat=Women">Women</a><a href="category.html?cat=Boys">Boys</a><a href="category.html?cat=Girls">Girls</a></div><div class="actions"><button class="iconbtn" onclick="location.href='order.html'">🛒</button></div></nav></header>
<main class="page"><div class="crumb"><a href="category.html">Collection</a> / Product</div><div id="app"><div class="notice">Loading product…</div></div></main>
<footer class="footer"><div class="footer-inner"><div><div class="logo">Golden<span>Ring</span>Wear</div><p>Premium rainwear.</p></div><div><b>Contact</b><p>+91 62064 31434<br>goldenringwear@gmail.com</p></div><div><b>Payment</b><p>COD + Online UPI</p></div></div></footer>
<script>
const API='https://script.google.com/macros/s/AKfycbwUKzE8q4bVvsZgXbrRvY89QkKsxaBV0pmF7erg1WBgiBb5O6CzjBtV_pFFoNi5TKt0sQ/exec';const id=new URLSearchParams(location.search).get("id");let p=null,qty=1,color="",size="",images=[],idx=0;
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){images=[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean);idx=Math.min(idx,images.length-1);document.getElementById("app").innerHTML=`<div class="product"><div class="gallery"><div class="thumbs">${images.map((im,i)=>`<button class="thumb ${i===idx?"active":""}" onclick="showImage(${i})"><img src="${im}" alt=""></button>`).join("")}</div><div class="main-image"><img id="mainImg" src="${images[idx]||""}" alt="${p.name}"><button class="arrow prev" onclick="move(-1)">‹</button><button class="arrow next" onclick="move(1)">›</button></div></div><div><div class="eyebrow">${p.category}</div><h1>${p.name}</h1><p class="muted">${p.description||"Premium rainwear designed for everyday use."}</p><div class="bigprice">${money(p.finalPrice||p.price)}${p.salePrice>0&&p.salePrice<p.price?`<span class="old">${money(p.price)}</span>`:""}</div><div class="notice">Final checkout total = product amount + 5% GST. Delivery charge: ₹0.</div>${p.colors&&p.colors.length?`<div class="label">Colour</div><div class="chips" id="colors">${p.colors.map(x=>`<button class="chip" data-type="color" data-value="${x}">${x}</button>`).join("")}</div>`:""}${p.sizes&&p.sizes.length?`<div class="label">Size</div><div class="chips" id="sizes">${p.sizes.map(x=>`<button class="chip" data-type="size" data-value="${x}">${x}</button>`).join("")}</div>`:""}<div class="label">Quantity</div><div class="qty"><button onclick="changeQty(-1)">−</button><input id="qty" value="1" readonly><button onclick="changeQty(1)">+</button></div><button class="btn dark" onclick="addCart()">ADD TO CART</button><button class="btn gold" onclick="buyNow()">BUY NOW</button><button class="btn wish" onclick="wishlist()">♡ ADD TO WISHLIST</button></div></div>`;document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const t=c.dataset.type;document.querySelectorAll('.chip[data-type="'+t+'"]').forEach(x=>x.classList.remove("selected"));c.classList.add("selected");if(t==="color")color=c.dataset.value;else size=c.dataset.value})}
function showImage(i){idx=i;document.getElementById("mainImg").src=images[idx];document.querySelectorAll(".thumb").forEach((x,n)=>x.classList.toggle("active",n===idx))}
function move(n){idx=(idx+n+images.length)%images.length;showImage(idx)}
function changeQty(n){qty=Math.max(1,Math.min(Number(p.stock||1),qty+n));document.getElementById("qty").value=qty}
function getCart(){try{return JSON.parse(localStorage.getItem("grw_cart")||"[]")}catch(e){return[]}}
function saveCart(c){localStorage.setItem("grw_cart",JSON.stringify(c))}
function addCart(){let c=getCart(),key=p.id+"|"+color+"|"+size,x=c.find(i=>i.key===key);if(x)x.quantity=Math.min(Number(p.stock||999),x.quantity+qty);else c.push({key:key,productId:p.id,name:p.name,price:(p.finalPrice||p.price),image:p.image,color:color,size:size,quantity:qty});saveCart(c);location.href="order.html"}
function buyNow(){localStorage.setItem("grw_cart",JSON.stringify([{key:p.id+"|"+color+"|"+size,productId:p.id,name:p.name,price:(p.finalPrice||p.price),image:p.image,color:color,size:size,quantity:qty}]));location.href="order.html"}
function wishlist(){let w=[];try{w=JSON.parse(localStorage.getItem("grw_wishlist")||"[]")}catch(e){}if(!w.some(x=>x.id===p.id)){w.push({id:p.id,name:p.name,image:p.image,price:p.finalPrice||p.price});localStorage.setItem("grw_wishlist",JSON.stringify(w));alert("Added to wishlist.")}else alert("Already in wishlist.")}
if(!id)document.getElementById("app").innerHTML='<div class="notice">Product ID missing.</div>';else fetch(API+"?action=product&id="+encodeURIComponent(id)).then(r=>r.json()).then(d=>{if(d&&d.ok&&d.product){p=d.product;document.title=p.name+" | GoldenRingWear";render()}else document.getElementById("app").innerHTML='<div class="notice">Product not found.</div>'}).catch(()=>document.getElementById("app").innerHTML='<div class="notice">Product is temporarily unavailable.</div>');
</script></body></html>
