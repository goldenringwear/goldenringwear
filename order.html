<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | GoldenRingWear</title>
<style>
:root{--navy:#07111f;--gold:#caa45d;--gold2:#e5c27b;--cream:#f7f3ea;--muted:#718096;--line:#e8e3d8;--shadow:0 18px 50px rgba(7,17,31,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--navy)}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}
.topbar{background:var(--navy);color:#fff;text-align:center;padding:9px 16px;font-size:12px}.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #eee}.nav{max-width:1240px;margin:auto;padding:17px 22px;display:flex;align-items:center;gap:28px}.logo{font:700 24px Georgia,serif}.logo span{color:var(--gold)}.menu{display:flex;gap:25px;margin-left:auto;font-size:14px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer}
.checkout{max-width:1100px;margin:auto;padding:45px 22px 90px}.crumb{font-size:13px;color:var(--muted);margin-bottom:25px}.page-title{font:400 46px Georgia,serif;margin:0 0 25px}.checkout-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:35px}.box{border:1px solid var(--line);border-radius:14px;padding:24px}.box h2{font:400 27px Georgia,serif;margin-top:0}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:5px;outline:none}.field textarea{min-height:95px;resize:vertical}.summary-row{display:flex;justify-content:space-between;margin:13px 0;gap:10px}.total{border-top:1px solid var(--line);padding-top:15px;font-size:20px;font-weight:800}.pay{display:flex;gap:10px}.pay label{flex:1;border:1px solid #ddd;border-radius:7px;padding:14px;cursor:pointer}.notice{padding:14px;border-radius:8px;background:var(--cream);margin:15px 0;font-size:13px}.btn{width:100%;padding:15px;border:0;border-radius:5px;font-weight:800;cursor:pointer}.dark{background:var(--navy);color:#fff}.gold{background:var(--gold);color:#111}.upi{border:1px dashed #caa45d;padding:16px;border-radius:9px;margin-top:14px;background:#fffaf0}.copy{border:1px solid #ddd;background:#fff;border-radius:5px;padding:8px 10px;cursor:pointer;margin-top:8px}.item{display:flex;gap:12px;margin-bottom:18px}.itempic{width:65px;height:75px;background:#f1eee8;border-radius:6px;overflow:hidden;flex:none}.itempic img{width:100%;height:100%;object-fit:cover}.success{max-width:650px;margin:70px auto;padding:45px 25px;text-align:center;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.success h1{font:400 45px Georgia,serif}.bulk{margin-top:30px;background:var(--navy);color:#fff;border-radius:14px;padding:24px}.bulk p{color:#c7ced7;line-height:1.7}.bulk a{display:inline-block;padding:11px 15px;border:1px solid #687687;border-radius:5px;margin-right:7px;margin-top:5px}
@media(max-width:850px){.checkout-grid{grid-template-columns:1fr}.menu{display:none}}@media(max-width:560px){.checkout{padding:35px 15px 70px}.page-title{font-size:38px}.pay{flex-direction:column}}
</style></head>
<body><div class="topbar">PREMIUM RAINWEAR • 5% GST • FREE DELIVERY</div><header class="header"><nav class="nav"><a class="logo" href="index.html">Golden<span>Ring</span>Wear</a><div class="menu"><a href="category.html?cat=Men">Men</a><a href="category.html?cat=Women">Women</a><a href="category.html?cat=Boys">Boys</a><a href="category.html?cat=Girls">Girls</a></div><button class="iconbtn" onclick="location.href='category.html'">＋</button></nav></header>
<main class="checkout"><div class="crumb"><a href="index.html">Home</a> / Checkout</div><h1 class="page-title">Your Order</h1><div id="checkoutApp"></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbwUKzE8q4bVvsZgXbrRvY89QkKsxaBV0pmF7erg1WBgiBb5O6CzjBtV_pFFoNi5TKt0sQ/exec';let cart=[],settings={},upiId="";
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function loadCart(){try{cart=JSON.parse(localStorage.getItem("grw_cart")||"[]")}catch(e){cart=[]}}
function subtotal(){return cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.quantity||1),0)}
function render(){const app=document.getElementById("checkoutApp");if(!cart.length){app.innerHTML='<div class="success"><h1>Cart is empty</h1><p class="muted">Add a product before checkout.</p><button class="btn dark" onclick="location.href=\'category.html\'">Shop Collection</button></div>';return}
const sub=subtotal(),gst=sub*.05,total=sub+gst;app.innerHTML=`<div class="checkout-grid"><div><div class="box"><h2>Delivery Details</h2>
<div class="field"><label>FULL NAME *</label><input id="name" autocomplete="name" required></div><div class="field"><label>PHONE *</label><input id="phone" inputmode="tel" autocomplete="tel" required></div><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>FULL ADDRESS *</label><textarea id="address" autocomplete="street-address" required></textarea></div>
<div class="field"><label>PAYMENT METHOD *</label><div class="pay"><label><input type="radio" name="pay" value="COD" checked onchange="paymentChanged()"> Cash on Delivery</label><label><input type="radio" name="pay" value="UPI" onchange="paymentChanged()"> Online UPI Payment</label></div></div>
<div id="upiBox"></div><div class="field"><label>ORDER NOTE</label><textarea id="notes" placeholder="Optional"></textarea></div><button id="place" class="btn dark" onclick="placeOrder()">PLACE ORDER</button><div id="msg"></div></div>
<div class="bulk"><b>Bulk / Wholesale Order?</b><p>For schools, offices, teams, resellers or larger quantities, contact us directly for a bulk enquiry.</p><a href="mailto:goldenringwear@gmail.com?subject=GoldenRingWear%20Bulk%20Order%20Enquiry">Email</a><a href="tel:+916206431434">Call</a></div></div>
<div class="box"><h2>Order Summary</h2>${cart.map(i=>`<div class="item"><div class="itempic">${i.image?`<img src="${i.image}" alt="">`:""}</div><div style="flex:1"><b>${i.name}</b><div class="muted">Qty ${i.quantity}${i.color?" • "+i.color:""}${i.size?" • "+i.size:""}</div></div><b>${money(i.price*i.quantity)}</b></div>`).join("")}<div class="summary-row"><span>Product Amount</span><b>${money(sub)}</b></div><div class="summary-row"><span>GST (5%)</span><b>${money(gst)}</b></div><div class="summary-row"><span>Delivery</span><b>₹0.00</b></div><div class="summary-row total"><span>Grand Total</span><span>${money(total)}</span></div></div></div></div>`;paymentChanged()}
function paymentChanged(){const method=document.querySelector('input[name="pay"]:checked')?.value;const box=document.getElementById("upiBox");if(method!=="UPI"){box.innerHTML="";return}if(!upiId){box.innerHTML='<div class="notice">Online UPI is enabled, but the UPI ID has not been added to the Settings sheet yet.</div>';return}const amount=(subtotal()*1.05).toFixed(2);const link="upi://pay?pa="+encodeURIComponent(upiId)+"&pn="+encodeURIComponent("GoldenRingWear")+"&am="+amount+"&cu=INR";box.innerHTML=`<div class="upi"><b>Pay securely via UPI</b><div style="margin-top:7px">UPI ID: <strong id="upiText">${upiId}</strong></div><button class="copy" onclick="navigator.clipboard?.writeText(upiId);alert('UPI ID copied')">Copy UPI ID</button><a class="btn gold" style="display:block;text-align:center;margin-top:12px;text-decoration:none" href="${link}">OPEN UPI APP & PAY ${
money(amount)}</a><small>After payment, return here and tap “I Have Paid & Place Order”. Payment will be marked pending verification in Orders.</small></div>`;document.getElementById("place").textContent="I HAVE PAID & PLACE ORDER"}
function placeOrder(){const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),method=document.querySelector('input[name="pay"]:checked').value;if(!name||!phone||!address){document.getElementById("msg").innerHTML='<div class="notice">Please fill all required fields.</div>';return}if(method==="UPI"&&!upiId){document.getElementById("msg").innerHTML='<div class="notice">UPI ID is not configured yet.</div>';return}const payload={action:"createOrder",customerName:name,phone:phone,email:document.getElementById("email").value.trim(),address:address,paymentMethod:method,notes:document.getElementById("notes").value.trim(),items:cart.map(i=>({productId:i.productId,quantity:Number(i.quantity||1),color:i.color||"",size:i.size||""}))};const btn=document.getElementById("place");btn.disabled=true;btn.textContent="Submitting…";fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(r=>r.json()).then(r=>{if(r.ok){localStorage.removeItem("grw_cart");document.getElementById("checkoutApp").innerHTML=`<div class="success"><div class="eyebrow">Order Confirmed</div><h1>Thank you.</h1><p>Your order has been placed successfully.</p><div class="notice"><b>Order ID: ${r.orderId}</b><br>Product Amount: ${money(r.subtotal)}<br>GST: ${money(r.gst)}<br>Delivery: ₹0<br><b>Grand Total: ${money(r.total)}</b></div><p class="muted">We will contact you on your phone number for confirmation.</p><button class="btn dark" onclick="location.href='index.html'">Continue Shopping</button></div>`}else{throw new Error(r.error||"Order could not be placed")}}).catch(e=>{btn.disabled=false;btn.textContent=method==="UPI"?"I HAVE PAID & PLACE ORDER":"PLACE ORDER";document.getElementById("msg").innerHTML='<div class="notice">Order could not be placed: '+e.message+'</div>'})}
loadCart();render();fetch(API+"?action=settings").then(r=>r.json()).then(d=>{settings=d&&d.settings?d.settings:{};upiId=String(settings["UPI ID"]||settings["UPI"]||"").trim();paymentChanged()}).catch(()=>{});
</script></body></html>
